spring:
  application:
    name: sammy
  main:
    keep-alive: true
  datasource:
    url: "jdbc:h2:file:./data/sammy;WRITE_DELAY=0"
    username: ${SAMMY_DB_USER}
    password: ${SAMMY_DB_PASSWORD}

sammy:
  media:
    max-size-bytes: 2097152
    allowed-mime-types:
      - image/jpeg
      - image/png
      - image/webp
      - application/pdf
      # נוסיף OGG לפי הזיהוי בפועל של Tika
    storage-directory: data/media